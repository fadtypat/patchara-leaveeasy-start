<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ใส่ข้อมูลตัวอย่างลง Firestore · LeaveEasy</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/firebase-init.js"></script>
  <script src="js/util.js" defer></script>
  <script src="js/nav.js" defer></script>
  <script src="js/data.js" defer></script>
  <script type="module" src="js/seed.js"></script>
</head>
<body>
  <div id="nav"></div>

  <div class="container">
    <h1>ใส่ข้อมูลตัวอย่างลง Firestore</h1>
    <p class="subtitle">
      หน้านี้เป็นเครื่องมือสำหรับผู้พัฒนา — กดปุ่มเพื่อคัดลอกข้อมูลจาก <code>js/data.js</code>
      ไปเขียนลง Firestore จริง (users, leaveTypes, leaveRequests) กดซ้ำได้อย่างปลอดภัย
    </p>

    <div class="card">
      <div class="btn-row">
        <button type="button" id="ปุ่มใส่ข้อมูล">ใส่ข้อมูลตัวอย่างลง Firestore</button>
      </div>
      <p id="ผลลัพธ์" class="hint">ยังไม่ได้กด</p>
    </div>
  </div>
</body>
</html>
